<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — Focusly</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
</head>
<body>

<div class="app-page">

  <!-- App Header -->
  <header class="app-header" role="banner">
    <div class="container app-header-inner">

      <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Open menu" aria-expanded="false">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>

      <a href="dashboard.html" class="app-logo" aria-label="Focusly Dashboard">
        <div class="app-logo-icon" aria-hidden="true">
          <svg width="34" height="34" viewBox="0 0 34 34" fill="none">
            <rect width="34" height="34" rx="9" fill="url(#dhgrd)"/>
            <line x1="11" y1="13" x2="23" y2="13" stroke="rgba(255,255,255,.4)" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="11" y1="17" x2="19" y2="17" stroke="rgba(255,255,255,.4)" stroke-width="1.5" stroke-linecap="round"/>
            <circle cx="23" cy="21" r="5" fill="#fff" fill-opacity=".15"/>
            <polyline points="20.5,21 22.2,22.8 25.5,19.2" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            <defs>
              <linearGradient id="dhgrd" x1="0" y1="0" x2="34" y2="34" gradientUnits="userSpaceOnUse">
                <stop stop-color="#6366f1"/><stop offset="1" stop-color="#4f46e5"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <div class="nav-logo-wordmark">
          <span class="logo-text-focus">Focus</span><span class="logo-text-ly">ly</span>
        </div>
      </a>

      <!-- Search -->
      <div class="header-search" role="search">
        <div class="input-wrap has-right">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input
            type="search" id="headerSearch"
            class="form-control" placeholder="Search tasks…"
            aria-label="Search tasks"
            autocomplete="off"
          />
          <button class="search-clear" id="searchClear" aria-label="Clear search">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
      </div>

      <div class="header-spacer"></div>

      <div class="header-actions">
        <button class="btn btn-primary btn-sm" data-action="open-task-modal" aria-label="Add new task">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Add Task
        </button>

        <!-- User Menu -->
        <div class="user-menu" id="userMenu" role="navigation" aria-label="User menu">
          <button class="user-trigger" id="userTrigger" aria-haspopup="true" aria-expanded="false">
            <div class="user-avatar" aria-hidden="true" data-user-avatar>?</div>
            <span class="user-name" data-user-name></span>
            <svg class="user-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div class="user-dropdown" role="menu">
            <div class="user-dropdown-info">
              <div class="user-dropdown-name" data-user-name></div>
              <div class="user-dropdown-email" data-user-email></div>
            </div>
            <a href="profile.html" class="dropdown-item" role="menuitem">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.58-7 8-7s8 3 8 7"/></svg>
              Profile
            </a>
            <div class="dropdown-divider" role="separator"></div>
            <button class="dropdown-item danger" id="logoutBtn" role="menuitem">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
              Sign out
            </button>
          </div>
        </div>
      </div>

    </div>
  </header>

  <!-- Mobile App Nav -->
  <nav class="mobile-app-nav" id="mobileAppNav" aria-label="Mobile navigation">
    <div class="mobile-user-info">
      <div class="user-avatar" data-user-avatar>?</div>
      <div>
        <div style="font-weight:500;font-size:.875rem;color:var(--text-1)" data-user-name></div>
        <div style="font-size:.75rem;color:var(--text-3)" data-user-email></div>
      </div>
    </div>
    <a href="dashboard.html" class="dropdown-item">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      Dashboard
    </a>
    <a href="profile.html" class="dropdown-item">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.58-7 8-7s8 3 8 7"/></svg>
      Profile
    </a>
    <div class="dropdown-divider"></div>
    <button class="dropdown-item danger" id="logoutBtn">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      Sign out
    </button>
  </nav>

  <!-- Main Content -->
  <main class="dashboard-main" id="main" tabindex="-1">
    <div class="container">

      <!-- Top -->
      <div class="dashboard-top">
        <div class="dashboard-greeting">
          <h1 id="greeting">Good morning.</h1>
          <p>Here's what's on your plate today.</p>
        </div>
        <button class="btn btn-primary" data-action="open-task-modal" aria-label="Add new task">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          New Task
        </button>
      </div>

      <!-- Stats -->
      <div class="stats-grid" role="region" aria-label="Task statistics">

        <div class="stat-card">
          <div class="stat-top">
            <span class="stat-label">Total Tasks</span>
            <div class="stat-icon blue" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M9 12l2 2 4-4"/></svg>
            </div>
          </div>
          <div class="stat-value" id="statTotal" aria-live="polite" aria-atomic="true">0</div>
          <div class="stat-footer">All tasks in your list</div>
        </div>

        <div class="stat-card">
          <div class="stat-top">
            <span class="stat-label">Active</span>
            <div class="stat-icon indigo" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            </div>
          </div>
          <div class="stat-value" id="statActive" aria-live="polite" aria-atomic="true">0</div>
          <div class="stat-footer">Tasks in progress</div>
        </div>

        <div class="stat-card">
          <div class="stat-top">
            <span class="stat-label">Completed</span>
            <div class="stat-icon green" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
            </div>
          </div>
          <div class="stat-value" id="statCompleted" aria-live="polite" aria-atomic="true">0</div>
          <div class="stat-footer">Tasks finished</div>
        </div>

        <div class="stat-card">
          <div class="stat-top">
            <span class="stat-label">Overdue</span>
            <div class="stat-icon red" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
            </div>
          </div>
          <div class="stat-value" id="statOverdue" aria-live="polite" aria-atomic="true">0</div>
          <div class="stat-footer">Past due date</div>
        </div>

      </div>

      <!-- Controls -->
      <div class="task-controls">
        <div class="filter-tabs" role="tablist" aria-label="Filter tasks">
          <button class="filter-tab active" data-filter="all"       role="tab" aria-selected="true">All</button>
          <button class="filter-tab"        data-filter="active"    role="tab" aria-selected="false">Active</button>
          <button class="filter-tab"        data-filter="completed" role="tab" aria-selected="false">Completed</button>
          <button class="filter-tab"        data-filter="overdue"   role="tab" aria-selected="false">Overdue</button>
          <button class="filter-tab"        data-filter="high"      role="tab" aria-selected="false">High Priority</button>
          <button class="filter-tab"        data-filter="medium"    role="tab" aria-selected="false">Medium</button>
          <button class="filter-tab"        data-filter="low"       role="tab" aria-selected="false">Low</button>
        </div>

        <div class="sort-select-wrap">
          <label for="sortSelect">Sort by</label>
          <select id="sortSelect" class="sort-select" aria-label="Sort tasks">
            <option value="newest">Newest</option>
            <option value="oldest">Oldest</option>
            <option value="dueDate">Due Date</option>
            <option value="priority">Priority</option>
            <option value="alpha">A → Z</option>
          </select>
        </div>
      </div>

      <!-- Task List -->
      <div id="taskList" role="list" aria-label="Task list" aria-live="polite"></div>

    </div>
  </main>

</div><!-- /.app-page -->

<!-- Task Modal -->
<div class="modal-backdrop" id="taskModalBackdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal" role="document">
    <div class="modal-header">
      <h2 class="modal-title" id="modalTitle">Create Task</h2>
      <button class="modal-close" id="modalClose" aria-label="Close modal">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <form id="taskForm" novalidate>
      <div class="modal-body task-form">

        <div class="form-group">
          <label class="form-label" for="taskTitle">Task title <span class="required" aria-hidden="true">*</span></label>
          <input type="text" id="taskTitle" class="form-control" placeholder="What needs to be done?" required aria-required="true" maxlength="120" />
          <span class="form-error" id="taskTitleError" role="alert" aria-live="polite"></span>
        </div>

        <div class="form-group">
          <label class="form-label" for="taskDescription">Description</label>
          <textarea id="taskDescription" class="form-control" placeholder="Add more detail…" rows="3" style="resize:vertical" maxlength="500"></textarea>
        </div>

        <div class="form-group">
          <label class="form-label">Priority</label>
          <div class="priority-group" role="radiogroup" aria-label="Task priority">
            <input type="radio" name="priority" id="prHigh"   value="high"   class="priority-radio" />
            <label for="prHigh"   class="priority-label priority-label-high">High</label>
            <input type="radio" name="priority" id="prMedium" value="medium" class="priority-radio" checked />
            <label for="prMedium" class="priority-label priority-label-medium">Medium</label>
            <input type="radio" name="priority" id="prLow"    value="low"    class="priority-radio" />
            <label for="prLow"    class="priority-label priority-label-low">Low</label>
          </div>
        </div>

        <div class="form-row-2">
          <div class="form-group">
            <label class="form-label" for="taskDueDate">Due date</label>
            <input type="date" id="taskDueDate" class="form-control" aria-label="Task due date" />
          </div>
          <div class="form-group">
            <label class="form-label" for="taskCategory">Category</label>
            <input type="text" id="taskCategory" class="form-control" placeholder="e.g. Work, Personal…" maxlength="40" />
            <div class="category-suggestions" aria-label="Category suggestions">
              <button type="button" class="cat-chip" data-cat="Work">Work</button>
              <button type="button" class="cat-chip" data-cat="Personal">Personal</button>
              <button type="button" class="cat-chip" data-cat="Design">Design</button>
              <button type="button" class="cat-chip" data-cat="Dev">Dev</button>
              <button type="button" class="cat-chip" data-cat="Health">Health</button>
            </div>
          </div>
        </div>

      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" id="modalCancelBtn" onclick="document.getElementById('taskModalBackdrop').classList.remove('open')">Cancel</button>
        <button type="submit" class="btn btn-primary" id="taskSubmitBtn">Save Task</button>
      </div>
    </form>
  </div>
</div>

<!-- Toast -->
<div id="toast-container" role="status" aria-live="polite" aria-atomic="true"></div>

<script type="module" src="js/dashboard.js"></script>

</body>
</html>
